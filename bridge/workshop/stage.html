<!doctype html>
<!--
  The stage: the one place code a model wrote is allowed to run.

  It is served by the core with `sandbox allow-scripts` and a policy that gives
  it scripts from this address and nothing else: no network, no storage, no
  cookies, no forms, no popups, no way to reach the page that frames it except
  by posting a message. Never loosen any of that to fix a bug in here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jett stage</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #labels { pointer-events: none; }
      #stage { cursor: grab; touch-action: none; outline: none; }
      #stage:active { cursor: grabbing; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/workshop/vendor/__V__/three.module.min.js", "three/addons/": "/workshop/vendor/__V__/jsm/" } }
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="labels"></canvas>
    <script>
      // Before the stage is up, anything that goes wrong is a stage that failed to start.
      // A fault inside the render loop would arrive sixty times a second, so only
      // the first few are passed on.
      let told = 0
      const fault = (message) =>
        told++ < 12 && parent.postMessage({ from: 'jett-stage', type: 'fault', message: String(message).slice(0, 300) }, '*')
      // The seal doing its job: something in here tried to reach out and was refused.
      let refused = 0
      addEventListener('securitypolicyviolation', (e) => {
        if (refused++ < 8)
          parent.postMessage(
            { from: 'jett-stage', type: 'refused', what: String(e.effectiveDirective), where: String(e.blockedURI).slice(0, 120) },
            '*',
          )
      })
      addEventListener('error', (e) => fault(e.message || 'the stage hit an error'))
      addEventListener('unhandledrejection', (e) => fault(e.reason?.message ?? e.reason ?? 'the stage hit an error'))
    </script>
    <script type="module" src="/workshop/stage.js?v=__S__" onerror="fault('the stage script did not load')"></script>
  </body>
</html>
